<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキル診断 | VISION</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

  :root {
    --bg: #0a0a14;
    --surface: #12121f;
    --card: #1a1a2e;
    --border: #2a2a4a;
    --accent: #5b6ef5;
    --accent2: #a78bfa;
    --text: #f0f0fa;
    --muted: #8888aa;
    --success: #4ade80;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .wrapper {
    width: 100%;
    max-width: 640px;
  }

  /* ── TOP ── */
  #screen-top {
    text-align: center;
  }

  .logo {
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--accent2);
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .top-eyebrow {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .top-title {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .top-desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 40px;
  }

  .btn-start {
    display: inline-block;
    padding: 18px 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
    letter-spacing: 0.05em;
  }

  .btn-start:hover { opacity: 0.85; transform: translateY(-2px); }

  .top-note {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ── QUIZ ── */
  #screen-quiz { display: none; }

  .progress-bar-wrap {
    background: var(--border);
    border-radius: 100px;
    height: 6px;
    margin-bottom: 32px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  .q-counter {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-bottom: 8px;
  }

  .q-text {
    font-size: clamp(17px, 3.5vw, 22px);
    font-weight: 700;
    line-height: 1.6;
    margin-bottom: 28px;
    min-height: 80px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .choice-btn {
    display: block;
    width: 100%;
    padding: 18px 20px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    line-height: 1.5;
  }

  .choice-btn:hover {
    border-color: var(--accent);
    background: rgba(91,110,245,0.12);
    transform: translateX(4px);
  }

  .choice-btn.selected {
    border-color: var(--accent2);
    background: rgba(167,139,250,0.18);
  }

  /* ── RESULT ── */
  #screen-result { display: none; }

  .result-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .result-eyebrow {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .result-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .result-skill-name {
    font-size: clamp(30px, 7vw, 48px);
    font-weight: 900;
    background: linear-gradient(135deg, #fff, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .result-type-tag {
    display: inline-block;
    padding: 6px 18px;
    background: rgba(91,110,245,0.2);
    border: 1px solid var(--accent);
    border-radius: 100px;
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 16px;
  }

  .result-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.8;
    max-width: 480px;
    margin: 0 auto;
  }

  /* スコアバー */
  .score-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }

  .score-section-title {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .score-row:last-child { margin-bottom: 0; }

  .score-skill-label {
    font-size: 13px;
    font-weight: 700;
    width: 100px;
    flex-shrink: 0;
    color: var(--text);
  }

  .score-skill-label.top {
    color: var(--accent2);
  }

  .score-bar-bg {
    flex: 1;
    height: 10px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 100px;
    width: 0%;
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .score-bar-fill.top {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .score-bar-fill.normal {
    background: var(--border);
    background: linear-gradient(90deg, #3a3a5a, #4a4a6a);
  }

  .score-crown {
    font-size: 16px;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }

  /* CTA */
  .cta-section {
    background: linear-gradient(135deg, rgba(91,110,245,0.15), rgba(167,139,250,0.15));
    border: 1px solid rgba(91,110,245,0.3);
    border-radius: var(--radius);
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  .cta-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .cta-desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.7;
  }

  .btn-cta {
    display: inline-block;
    padding: 16px 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.2s;
  }

  .btn-cta:hover { opacity: 0.85; transform: translateY(-2px); }

  .btn-retry {
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    margin-top: 16px;
    text-decoration: underline;
    background: none;
    border: none;
    font-family: inherit;
  }

  .btn-retry:hover { color: var(--text); }

  /* ── fade anim ── */
  .fade-in {
    animation: fadeIn 0.35s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- TOP -->
  <div id="screen-top" class="fade-in">
    <div class="logo">VISION</div>
    <p class="top-eyebrow">SKILL DIAGNOSIS</p>
    <h1 class="top-title">あなたに合った<br>スキルが分かる</h1>
    <p class="top-desc">
      20問の質問に答えるだけで、<br>
      あなたの適性スキルを診断します。<br>所要時間：約3分
    </p>
    <button class="btn-start" onclick="startQuiz()">診断スタート</button>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz">
    <div class="q-counter" id="q-counter">1 / 20</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar" style="width:5%"></div>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="choices" id="choices"></div>
  </div>

  <!-- RESULT -->
  <div id="screen-result">
    <div class="result-header fade-in">
      <p class="result-eyebrow">DIAGNOSIS RESULT</p>
      <p class="result-label">あなたに一番向いているのは</p>
      <div class="result-skill-name" id="result-skill-name"></div>
      <div class="result-type-tag" id="result-type-tag"></div>
      <p class="result-desc" id="result-desc"></p>
    </div>

    <div class="score-section fade-in">
      <p class="score-section-title">適性スコア</p>
      <div id="score-bars"></div>
    </div>

    <div class="cta-section fade-in">
      <p class="cta-title">この画面をスクショして保存してください</p>
      <p class="cta-desc">
        運営との初回面談で、この診断結果をもとに<br>
        あなたに合ったコースをご提案します。<br>
        面談前にスクリーンショットを撮っておいてください。
      </p>
    </div>
  </div>

</div>
