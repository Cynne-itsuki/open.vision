<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1730">
  <meta name="description" content="面談前の簡単なアンケートです。">
  <title>面談前アンケート</title>
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <main class="app-shell">
    <section class="panel" aria-live="polite">
      <div id="screen-start" class="screen active hero">
        <p class="eyebrow">面談前アンケート</p>
        <h1>現在の状況について<br><span class="gradient-text">簡単に教えてください</span></h1>
        <p class="hero-copy">
          面談をスムーズに進めるため、現在の状況と相談したい内容を確認します。
          回答は全部で6問です。
        </p>
        <div class="badge-row" aria-label="アンケート概要">
          <span class="badge">約1分</span>
          <span class="badge">全6問</span>
          <span class="badge">選択式中心</span>
        </div>
        <button id="start-button" class="button button-primary" type="button">アンケートを始める</button>
      </div>

      <div id="screen-form" class="screen">
        <div class="progress-header">
          <div class="progress-meta">
            <span id="section-label">基本情報</span>
            <span id="progress-count">1 / 6</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>

        <div class="question-area">
          <p id="question-kicker" class="question-kicker"></p>
          <h2 id="question-title" class="question-title"></h2>
          <p id="question-help" class="question-help"></p>
          <div id="answer-area"></div>

          <div class="navigation-row">
            <button id="back-button" class="button button-secondary" type="button">戻る</button>
            <button id="next-button" class="button button-primary" type="button">次へ</button>
          </div>
        </div>
      </div>

      <div id="screen-complete" class="screen result-screen">
        <p class="result-eyebrow">YOUR CONSULTATION TYPE</p>
        <div id="result-code" class="result-code">PLAN</div>
        <h2 id="result-title" class="result-title">じっくり整理タイプ</h2>
        <p id="result-description" class="result-description"></p>
        <div id="result-tags" class="result-tags" aria-label="気になるテーマ"></div>

        <div class="screenshot-card">
          <span class="screenshot-icon" aria-hidden="true">▣</span>
          <div>
            <strong>この画面をスクショしてください</strong>
            <p>スクリーンショットを保存して、面談当日にご参加ください。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <iframe id="submission-frame" name="submission-frame" title="回答送信" hidden></iframe>
  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js?v=4"></script>
</body>
</html>
